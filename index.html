<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearnSpace — Learning Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17211d;--muted:#718078;--line:#e6ebe7;--bg:#f6f8f6;--green:#176b4b;--lime:#d9f36a;--white:#fff;--red:#b33a3a;--shadow:0 12px 40px #193b2a0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#102c22;color:white;padding:28px 20px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;gap:11px;align-items:center;font:800 20px Manrope}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--lime);color:#173b2b;display:grid;place-items:center;font-weight:900}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#b8c9c0;text-align:left;padding:12px 14px;border-radius:10px;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff17;color:white}.sidebottom{margin-top:auto;color:#9fb2a7;font-size:12px;line-height:1.6}.main{padding:28px 4vw 60px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.6px;font-weight:800;text-transform:uppercase}.top h1{font:800 clamp(25px,3vw,34px) Manrope;margin:5px 0}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:800}.muted{color:var(--muted)}.btn{padding:11px 16px;border-radius:10px;background:var(--green);color:white;font-weight:700}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:8px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}.stat,.panel,.course{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:20px}.stat label{color:var(--muted);font-size:13px}.stat strong{display:block;font:800 30px Manrope;margin-top:8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px;gap:12px}.sectionhead h2{font:800 20px Manrope;margin:0}.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.course{overflow:hidden}.cover{height:120px;padding:17px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#d9f36a,#a4d9b8);font:800 23px Manrope;color:#173b2b}.cover.c2{background:linear-gradient(135deg,#d9e8ff,#a8bce9)}.cover.c3{background:linear-gradient(135deg,#ffe2c6,#efb18c)}.coursebody{padding:17px}.course h3{font:700 16px Manrope;margin:0 0 7px}.course p{font-size:13px;color:var(--muted);line-height:1.5;min-height:38px;margin:0 0 14px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.panel{padding:22px}.empty{padding:36px 20px;text-align:center;color:var(--muted);background:white;border:1px dashed #ccd8d0;border-radius:15px}.authwrap{max-width:440px;margin:8vh auto;background:white;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}.authwrap h1{font:800 26px Manrope;margin:0 0 8px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#526159}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #dce4de;border-radius:9px;outline:none;background:white}.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b4b16}.field textarea{min-height:90px;resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:11px 13px;border-radius:9px;background:#eff8f2;color:#23583f;font-size:13px;margin:12px 0}.error{background:#fff0f0;color:#a12c2c}.hidden{display:none!important}.lessonrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}.lessonrow:last-child{border:0}.lessonrow h4{margin:0 0 4px;font-size:14px}.progress{height:7px;border-radius:8px;background:#edf1ed;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:var(--green);border-radius:8px}.tag{font-size:11px;background:#eff7ef;color:var(--green);padding:5px 8px;border-radius:30px;font-weight:700}.modalback{position:fixed;inset:0;background:#10251dcc;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:white;border-radius:17px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font:800 20px Manrope;margin:0}.toast{position:fixed;right:20px;bottom:20px;background:#173b2b;color:white;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:10;max-width:360px}.footerhint{font-size:12px;color:var(--muted);margin-top:24px}
@media(max-width:1000px){.courses{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{padding:14px 16px;gap:12px}.side .brand{margin-bottom:2px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.sidebottom{display:none}.main{padding:22px 16px 45px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:24px}.courses{grid-template-columns:1fr}.top{align-items:flex-start}.userbox{font-size:12px}.formrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <section class="authwrap">
    <div class="brand" style="color:#173b2b;margin-bottom:25px"><span class="brandmark">L</span> LearnSpace</div>
    <h1>Learn something great.</h1><p class="muted">Sign in or create an account to access your learning space.</p>
    <div id="authMsg"></div>
    <form id="authForm">
      <div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="At least 6 characters"></div>
      <button class="btn" id="authSubmit" style="width:100%">Sign in</button>
    </form>
    <p style="font-size:13px;text-align:center;margin-top:18px"><span id="authToggleText">New to LearnSpace?</span> <a href="#" id="authToggle" style="color:var(--green);font-weight:700">Create account</a></p>
    <p class="footerhint">Your account is securely managed by Supabase Auth.</p>
  </section>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const SUPABASE_URL = "https://xqvlghfofdwttlynlnrq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_R-2mXy1o9OunUAeCo3p5tw_YWb1mviA";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let user = null, courses = [], myEnrollments = [], currentView = "dashboard", authMode = "signin", selectedCourse = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, bad=false){$("toastRoot").innerHTML=`<div class="toast" style="${bad?'background:#8f2929':''}">${esc(msg)}</div>`;setTimeout(()=>$("toastRoot").innerHTML="",3200)}
function showError(id,msg){$(id).innerHTML=`<div class="notice error">${esc(msg)}</div>`}
function authScreen(){
$("app").innerHTML=`<section class="authwrap"><div class="brand" style="color:#173b2b;margin-bottom:25px"><span class="brandmark">L</span> LearnSpace</div><h1>${authMode==="signin"?"Learn something great.":"Create your account."}</h1><p class="muted">${authMode==="signin"?"Sign in to continue learning.":"Join LearnSpace and start learning today."}</p><div id="authMsg"></div><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="At least 6 characters"></div><button class="btn" style="width:100%">${authMode==="signin"?"Sign in":"Create account"}</button></form><p style="font-size:13px;text-align:center;margin-top:18px">${authMode==="signin"?"New to LearnSpace?":"Already have an account?"} <a href="#" id="authToggle" style="color:var(--green);font-weight:700">${authMode==="signin"?"Create account":"Sign in"}</a></p><p class="footerhint">Your account is securely managed by Supabase Auth.</p></section>`;
$("authToggle").onclick=e=>{e.preventDefault();authMode=authMode==="signin"?"signup":"signin";authScreen()};
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("email").value.trim(),password=$("password").value;const b=e.submitter;b.disabled=true;b.textContent="Please wait…";let result=authMode==="signin"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});b.disabled=false;b.textContent=authMode==="signin"?"Sign in":"Create account";if(result.error)showError("authMsg",result.error.message);else if(authMode==="signup"&&!result.data.session)showError("authMsg","Account created. Check your email to confirm, then sign in.");else{user=result.data.user;renderApp()}};
}
function appShell(){
$("app").innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="brandmark">L</span> LearnSpace</div><nav class="nav"><button data-view="dashboard" class="active">▦ &nbsp; Dashboard</button><button data-view="explore">⌕ &nbsp; Explore courses</button><button data-view="my-learning">▤ &nbsp; My learning</button><button data-view="teaching">✎ &nbsp; My courses</button></nav><div class="sidebottom">A place to grow your skills.<br>Learn at your own pace.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">LEARNING MANAGEMENT</div><h1 id="pageTitle">Your dashboard</h1><div class="muted" id="pageSub">Welcome back. Keep your momentum going.</div></div><div class="userbox"><div class="avatar">${esc((user.email||"U")[0].toUpperCase())}</div><div><b style="font-size:13px">${esc(user.email)}</b><br><a href="#" id="logout" style="font-size:12px;color:var(--muted)">Sign out</a></div></div></header><div id="content"></div></main></div>`;
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));renderView()});
$("logout").onclick=async e=>{e.preventDefault();await db.auth.signOut();user=null;authMode="signin";authScreen()};
}
async function loadData(){
const [c,e]=await Promise.all([db.from("lms_courses").select("*, lms_lessons(id,title,position)").order("created_at",{ascending:false}),db.from("lms_enrollments").select("course_id,created_at").eq("student_id",user.id)]);
if(c.error)throw c.error;if(e.error)throw e.error;courses=c.data||[];myEnrollments=e.data||[];
}
async function renderApp(){try{appShell();await loadData();renderView()}catch(e){$("content").innerHTML=`<div class="notice error">${esc(e.message)}<br>Run supabase.sql in your Supabase SQL Editor, then refresh.</div>`}}
function courseCard(c, mode){
const enrolled=myEnrollments.some(x=>x.course_id===c.id), lessons=(c.lms_lessons||[]).length;
return `<article class="course"><div class="cover ${["","c2","c3"][Math.abs(hash(c.id))%3]}">${esc((c.title||"Course").slice(0,22))}</div><div class="coursebody"><div class="meta"><span>${esc(c.category||"General")}</span><span>${lessons} lesson${lessons===1?"":"s"}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.description||"A course to help you build new skills.")}</p><div class="actions">${mode==="teaching"?`<button class="btn small" onclick="openLessons('${c.id}')">Manage lessons</button><button class="btn secondary small" onclick="editCourse('${c.id}')">Edit</button><button class="btn danger small" onclick="deleteCourse('${c.id}')">Delete</button>`:enrolled?`<button class="btn small" onclick="openCourse('${c.id}')">Continue learning</button>`:`<button class="btn small" onclick="enroll('${c.id}')">Enroll now</button><button class="btn secondary small" onclick="previewCourse('${c.id}')">View details</button>`}</div></div></article>`;
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
async function renderView(){
const title={dashboard:"Your dashboard",explore:"Explore courses","my-learning":"My learning",teaching:"My courses"}[currentView];$("pageTitle").textContent=title;$("pageSub").textContent={dashboard:"Welcome back. Keep your momentum going.",explore:"Find a course and start learning.", "my-learning":"Your enrolled courses and progress.",teaching:"Create and manage the courses you teach."}[currentView];
let html="";
if(currentView==="dashboard"){
const mine=courses.filter(c=>c.instructor_id===user.id), enrolled=courses.filter(c=>myEnrollments.some(e=>e.course_id===c.id));
html=`<section class="stats"><div class="stat"><label>Available courses</label><strong>${courses.filter(c=>c.is_published||c.instructor_id===user.id).length}</strong></div><div class="stat"><label>My enrollments</label><strong>${myEnrollments.length}</strong></div><div class="stat"><label>Courses I created</label><strong>${mine.length}</strong></div></section><div class="sectionhead"><h2>Continue learning</h2><button class="btn secondary small" onclick="switchView('my-learning')">View all</button></div>${enrolled.length?`<div class="courses">${enrolled.slice(0,3).map(c=>courseCard(c,"student")).join("")}</div>`:`<div class="empty">You haven't enrolled in a course yet. Explore the catalog to get started.</div>`}<div class="sectionhead"><h2>Created by you</h2><button class="btn small" onclick="switchView('teaching')">Manage courses</button></div>${mine.length?`<div class="courses">${mine.slice(0,3).map(c=>courseCard(c,"teaching")).join("")}</div>`:`<div class="empty">Share your knowledge. Create your first course.</div>`}`;
}else if(currentView==="explore"){
const available=courses.filter(c=>c.is_published||c.instructor_id===user.id);
html=`<div class="sectionhead"><h2>Course catalog</h2><span class="muted">${available.length} courses</span></div>${available.length?`<div class="courses">${available.map(c=>courseCard(c,"student")).join("")}</div>`:`<div class="empty">No published courses yet. Check back soon.</div>`}`;
}else if(currentView==="my-learning"){
const list=courses.filter(c=>myEnrollments.some(e=>e.course_id===c.id));
html=`<div class="sectionhead"><h2>Your learning path</h2><span class="muted">${list.length} enrolled</span></div>${list.length?`<div class="courses">${list.map(c=>courseCard(c,"student")).join("")}</div>`:`<div class="empty">You are not enrolled in any courses yet. <button class="btn small" onclick="switchView('explore')">Explore courses</button></div>`}`;
}else{
const mine=courses.filter(c=>c.instructor_id===user.id);
html=`<div class="sectionhead"><h2>Courses you teach</h2><button class="btn" onclick="courseModal()">＋ Create course</button></div>${mine.length?`<div class="courses">${mine.map(c=>courseCard(c,"teaching")).join("")}</div>`:`<div class="empty">You haven't created a course yet.<br><br><button class="btn" onclick="courseModal()">Create your first course</button></div>`}`;
}
$("content").innerHTML=html;
}
function switchView(v){currentView=v;document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));renderView()}
function modal(content){$("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$("modalRoot").innerHTML=""}
function courseModal(id=null){
const c=courses.find(x=>x.id===id)||{};
modal(`<div class="modalhead"><h2>${id?"Edit course":"Create a course"}</h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><form id="courseForm"><div class="field"><label>Course title</label><input name="title" required maxlength="120" value="${esc(c.title||"")}" placeholder="e.g. Introduction to Design"></div><div class="field"><label>Description</label><textarea name="description" placeholder="What will students learn?">${esc(c.description||"")}</textarea></div><div class="formrow"><div class="field"><label>Category</label><input name="category" value="${esc(c.category||"General")}" placeholder="Technology"></div><div class="field"><label>Visibility</label><select name="is_published"><option value="true" ${c.is_published!==false?"selected":""}>Published</option><option value="false" ${c.is_published===false?"selected":""}>Draft (private)</option></select></div></div><button class="btn" style="width:100%">${id?"Save changes":"Create course"}</button></form>`);
$("courseForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),payload={title:f.get("title").trim(),description:f.get("description").trim(),category:f.get("category").trim()||"General",is_published:f.get("is_published")==="true"};const res=id?await db.from("lms_courses").update(payload).eq("id",id).eq("instructor_id",user.id):await db.from("lms_courses").insert({...payload,instructor_id:user.id});if(res.error)return toast(res.error.message,true);closeModal();await loadData();renderView();toast(id?"Course updated":"Course created")};
}
function editCourse(id){courseModal(id)}
async function deleteCourse(id){if(!confirm("Delete this course and its lessons? This cannot be undone."))return;const r=await db.from("lms_courses").delete().eq("id",id).eq("instructor_id",user.id);if(r.error)return toast(r.error.message,true);await loadData();renderView();toast("Course deleted")}
function openLessons(id){const c=courses.find(x=>x.id===id);if(!c)return;selectedCourse=c;modal(`<div class="modalhead"><div><div class="eyebrow">COURSE CONTENT</div><h2>${esc(c.title)}</h2></div><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="lessonList" class="notice">Loading lessons…</div><button class="btn" onclick="lessonModal('${id}')" style="margin-top:14px">＋ Add lesson</button>`);loadLessons(id)}
async function loadLessons(id){const r=await db.from("lms_lessons").select("*").eq("course_id",id).order("position");if(r.error){$("lessonList").innerHTML=esc(r.error.message);return}const rows=r.data||[];$("lessonList").className="";$("lessonList").innerHTML=rows.length?rows.map(l=>`<div class="lessonrow"><div><h4>${esc(l.position)}. ${esc(l.title)}</h4><div class="muted" style="font-size:12px">${esc((l.content||"").slice(0,85))}</div></div><div class="actions"><button class="btn secondary small" onclick="lessonModal('${id}','${l.id}')">Edit</button><button class="btn danger small" onclick="deleteLesson('${id}','${l.id}')">Delete</button></div></div>`).join(""):`<div class="empty">No lessons yet. Add the first lesson.</div>`}
function lessonModal(courseId,lessonId=null){const c=selectedCourse,l=(c?.lms_lessons||[]).find(x=>x.id===lessonId)||{};modal(`<div class="modalhead"><h2>${lessonId?"Edit lesson":"Add a lesson"}</h2><button class="btn secondary small" onclick="openLessons('${courseId}')">Back</button></div><form id="lessonForm"><div class="field"><label>Lesson title</label><input name="title" required value="${esc(l.title||"")}"></div><div class="field"><label>Lesson content</label><textarea name="content" required placeholder="Write lesson notes, instructions, or a resource link…">${esc(l.content||"")}</textarea></div><div class="field"><label>Position</label><input name="position" type="number" min="1" value="${esc(l.position||((c?.lms_lessons||[]).length+1))}"></div><button class="btn" style="width:100%">Save lesson</button></form>`);$("lessonForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p={course_id:courseId,title:f.get("title").trim(),content:f.get("content").trim(),position:Number(f.get("position"))||1};const r=lessonId?await db.from("lms_lessons").update(p).eq("id",lessonId):await db.from("lms_lessons").insert(p);if(r.error)return toast(r.error.message,true);await loadData();selectedCourse=courses.find(x=>x.id===courseId);openLessons(courseId);toast("Lesson saved")}}
async function deleteLesson(courseId,id){if(!confirm("Delete this lesson?"))return;const r=await db.from("lms_lessons").delete().eq("id",id);if(r.error)return toast(r.error.message,true);await loadData();selectedCourse=courses.find(x=>x.id===courseId);openLessons(courseId);toast("Lesson deleted")}
async function enroll(id){const r=await db.from("lms_enrollments").insert({course_id:id,student_id:user.id});if(r.error&&r.error.code!=="23505")return toast(r.error.message,true);await loadData();renderView();toast("You're enrolled!")}
async function previewCourse(id){const c=courses.find(x=>x.id===id);if(!c)return;const r=await db.from("lms_lessons").select("*").eq("course_id",id).order("position");if(r.error)return toast(r.error.message,true);modal(`<div class="modalhead"><h2>${esc(c.title)}</h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><p class="muted">${esc(c.description||"")}</p><div class="eyebrow">${esc(c.category||"GENERAL")} · ${(r.data||[]).length} LESSONS</div><div style="margin-top:14px">${(r.data||[]).map(l=>`<div class="lessonrow"><div><h4>${esc(l.position)}. ${esc(l.title)}</h4><div class="muted" style="font-size:12px">${esc((l.content||"").slice(0,90))}</div></div></div>`).join("")||'<div class="empty">Lessons will be added soon.</div>'}</div><button class="btn" style="margin-top:18px" onclick="closeModal();enroll('${id}')">Enroll in course</button>`)}
async function openCourse(id){const c=courses.find(x=>x.id===id);if(!c)return;const [lr,pr]=await Promise.all([db.from("lms_lessons").select("*").eq("course_id",id).order("position"),db.from("lms_progress").select("lesson_id,completed").eq("student_id",user.id)]);if(lr.error||pr.error)return toast((lr.error||pr.error).message,true);const lessons=lr.data||[],done=new Set((pr.data||[]).filter(x=>x.completed).map(x=>x.lesson_id)),pct=lessons.length?Math.round(done.size/lessons.length*100):0;modal(`<div class="modalhead"><div><div class="eyebrow">MY LEARNING</div><h2>${esc(c.title)}</h2></div><button class="btn secondary small" onclick="closeModal()">✕</button></div><p class="muted">${esc(c.description||"")}</p><div class="meta"><span>Course progress</span><b>${pct}%</b></div><div class="progress"><span style="width:${pct}%"></span></div><div style="margin-top:15px">${lessons.map(l=>`<div class="lessonrow"><div><h4>${esc(l.position)}. ${esc(l.title)}</h4><div class="muted" style="font-size:12px;white-space:pre-wrap">${esc(l.content||"")}</div></div><button class="btn ${done.has(l.id)?"secondary":"small"}" style="font-size:12px" onclick="toggleProgress('${id}','${l.id}',${done.has(l.id)})">${done.has(l.id)?"Completed ✓":"Mark complete"}</button></div>`).join("")||'<div class="empty">No lessons have been added yet.</div>'}</div>`)}
async function toggleProgress(courseId,lessonId,isDone){const r=await db.from("lms_progress").upsert({student_id:user.id,lesson_id:lessonId,completed:!isDone,completed_at:!isDone?new Date().toISOString():null},{onConflict:"student_id,lesson_id"});if(r.error)return toast(r.error.message,true);openCourse(courseId)}
db.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;renderApp()}else authScreen()});
db.auth.onAuthStateChange((_event,session)=>{if(session&&(!user||user.id!==session.user.id)){user=session.user;renderApp()}else if(!session&&user){user=null;authScreen()}});
</script>
</body></html>
